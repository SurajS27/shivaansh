<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Play & Learn: Mid-Sem Syllabus</title>
    
    <!-- Tailwind CSS (CDN for quick setup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dots min-h-screen flex flex-col">

    <!-- Top Navigation / Header -->
    <header class="bg-white shadow-md p-4 sticky top-0 z-50 flex justify-between items-center rounded-b-3xl">
        <div class="flex items-center gap-3 cursor-pointer" onclick="goHome()">
            <div class="bg-yellow-300 text-3xl p-2 rounded-full bubbly-button">🧸</div>
            <h1 class="text-2xl md:text-3xl text-pink-500 font-bold tracking-wide">My First Class</h1>
        </div>
        <button id="homeBtn" class="hidden bg-blue-400 hover:bg-blue-500 text-white px-6 py-2 rounded-full font-bold bubbly-button text-lg" onclick="goHome()">
            🏠 Home
        </button>
    </header>

    <!-- Main Content Area -->
    <main id="app-container" class="flex-grow p-4 md:p-8 flex flex-col items-center justify-start w-full max-w-5xl mx-auto">
        <!-- Views will be injected here via JavaScript -->
    </main>

    <!-- Start Overlay (Required to unlock audio context in browsers) -->
    <div id="start-overlay" class="fixed inset-0 bg-white/90 backdrop-blur-sm z-[100] flex flex-col items-center justify-center p-6 text-center">
        <div class="text-6xl mb-6 animate-bounce">🎈</div>
        <h1 class="text-4xl md:text-5xl text-purple-600 mb-8 font-bold heading-font">Ready to Play & Learn?</h1>
        <p class="text-xl mb-8 text-gray-600 max-w-md font-bold">Parents: Make sure your volume is up so your child can hear the words!</p>
        <button onclick="startApp()" class="bg-green-500 text-white text-3xl px-10 py-5 rounded-3xl bubbly-button font-bold flex items-center gap-4">
            Let's Go! 🚀
        </button>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
